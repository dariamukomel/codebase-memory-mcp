[build-system]
requires = ["setuptools>=42", "wheel", "brotli"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-sql-polyglot"
description = "Tree-sitter Grammar for SQL"
version = "0.1.2"
keywords = ["incremental", "parsing", "tree-sitter", "sql"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "relativelyunknown" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/relativelyunknown/tree-sitter-sql-polyglot"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
