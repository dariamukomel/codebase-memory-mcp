name: Fork Release

on:
  push:
    tags:
      - 'v*-sql.*'

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-linux-amd64:
    name: Build and publish Linux amd64 portable with SQLGlot and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-sql\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Expected vX.Y.Z-sql.N." >&2
            exit 2
          fi
          git rev-parse --verify "refs/tags/$VERSION^{commit}" >/dev/null
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$VERSION' already exists." >&2
            exit 2
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 curl zlib1g-dev zip binutils file

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: graph-ui/package-lock.json

      - name: Prepare embedded CPython and SQLGlot
        run: bash scripts/prepare-sqlglot-embed.sh

      - name: Build static binary with UI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/build.sh \
            --with-ui \
            --version "$VERSION" \
            BUILD_DIR=build/fork-release \
            CC=gcc \
            CXX=g++ \
            STATIC=1

      - name: Verify static linking and embedded runtime
        run: |
          set -euo pipefail
          file build/fork-release/codebase-memory-mcp
          ldd_output="$(ldd build/fork-release/codebase-memory-mcp 2>&1 || true)"
          echo "$ldd_output"
          grep -Eq 'not a dynamic executable|statically linked' <<<"$ldd_output"
          python3 scripts/append-sqlglot-runtime.py --check build/fork-release/codebase-memory-mcp
          build/fork-release/codebase-memory-mcp --version

      - name: Package portable release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-release-candidates.sh \
            linux amd64-portable \
            --binary build/fork-release/codebase-memory-mcp \
            --out-dir build/fork-release-candidates

          mkdir -p release-output
          bash scripts/gen-third-party-notices.sh release-output/THIRD_PARTY_NOTICES.md

          selected_binary="build/fork-release-candidates/linux-amd64-portable/stripped/codebase-memory-mcp"
          # strip can remove the appended ZIP; validate the final candidate,
          # not only the original linker output, before publishing anything.
          python3 scripts/append-sqlglot-runtime.py --check "$selected_binary"
          python3 - "$selected_binary" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt runtime member: {bad}")
          PY
          "$selected_binary" --version
          selected_sha256="$(sha256sum "$selected_binary" | awk '{print $1}')"

          VERSION="$VERSION" bash scripts/package-release.sh \
            linux amd64-portable \
            --selected-binary "$selected_binary" \
            --expected-sha256 "$selected_sha256" \
            --third-party-notices release-output/THIRD_PARTY_NOTICES.md \
            --out-dir release-output

          cd release-output
          sha256sum \
            codebase-memory-mcp-linux-amd64-portable.tar.gz \
            codebase-memory-mcp-linux-amd64-portable.mcpb \
            > checksums.txt
          sha256sum -c checksums.txt

      - name: Preserve release files as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebase-memory-mcp-${{ github.ref_name }}-linux-amd64-portable
          path: |
            release-output/codebase-memory-mcp-linux-amd64-portable.tar.gz
            release-output/codebase-memory-mcp-linux-amd64-portable.mcpb
            release-output/checksums.txt
          if-no-files-found: error

      - name: Create GitHub release for pushed tag
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            release-output/codebase-memory-mcp-linux-amd64-portable.tar.gz \
            release-output/codebase-memory-mcp-linux-amd64-portable.mcpb \
            release-output/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Codebase Memory SQLGlot $VERSION" \
            --notes "Portable Linux x86_64 build with UI and embedded CPython/SQLGlot from commit $GITHUB_SHA." \
            --latest
